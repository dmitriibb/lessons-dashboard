name: Agent Orchestrator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt to send to the Manager
        required: false
        default: Pick up only task-1-init-backed-service and tell me whether it is ready for implementation.

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  manager:
    runs-on: ubuntu-latest

    env:
      BOT_GIT_NAME: ${{ vars.BOT_GIT_NAME }}
      BOT_GIT_EMAIL: ${{ vars.BOT_GIT_EMAIL }}
      MANAGER_PROMPT: ${{ inputs.prompt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BOT_GIT_NAME}" ]; then
            echo "Missing repository variable BOT_GIT_NAME"
            exit 1
          fi

          if [ -z "${BOT_GIT_EMAIL}" ]; then
            echo "Missing repository variable BOT_GIT_EMAIL"
            exit 1
          fi

          if [ -z "${MANAGER_PROMPT}" ]; then
            echo "Missing workflow input prompt"
            exit 1
          fi

      - name: Configure git bot identity
        run: |
          git config user.name "${BOT_GIT_NAME}"
          git config user.email "${BOT_GIT_EMAIL}"
          git config --get user.name
          git config --get user.email

      - name: Run Manager agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/agents/manager.py | tee manager-output.txt

      - name: Commit journal updates
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- tasks; then
            echo "No task journal updates were created"
            exit 0
          fi

          git add tasks
          git commit -m "chore: manager review task queue"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload manager output
        uses: actions/upload-artifact@v4
        with:
          name: manager-output
          path: manager-output.txt
